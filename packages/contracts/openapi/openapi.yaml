openapi: 3.1.0
info:
  title: OpenLink API
  version: 0.1.0
  description: Contract-first HTTP API for the OpenLink link shortener.
servers:
  - url: /api/v1
    description: Local and production Worker
tags:
  - name: System
  - name: Auth
  - name: Organizations
  - name: Domains
  - name: Links
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Dependency health probe
      description: >
        Checks every runtime dependency the API relies on (D1, Analytics Engine,
        auth configuration, domain provider, and the bundled OpenAPI contract).
      responses:
        '200':
          description: All required dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more required dependencies are unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      tags: [System]
      summary: OpenAPI document for this API
      responses:
        '200':
          description: OpenAPI 3.1 JSON
          content:
            application/json:
              schema:
                type: object
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [Auth]
      summary: Register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [Auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Signed out
  /auth/session:
    get:
      operationId: getSession
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current session if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Organizations the user belongs to
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createOrganization
      tags: [Organizations]
      summary: Create an organization (invite token required)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/invites/accept:
    post:
      operationId: acceptOrganizationInvite
      tags: [Organizations]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Invite accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: getOrganization
      tags: [Organizations]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{organizationId}/invites:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: createOrganizationInvite
      tags: [Organizations]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationInviteRequest'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{organizationId}/domains:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listDomains
      tags: [Domains]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Custom domains for the organization
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomDomain'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: addDomain
      tags: [Domains]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDomainRequest'
      responses:
        '201':
          description: Domain registration started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomain'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{organizationId}/domains/{domainId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/DomainId'
    get:
      operationId: getDomain
      tags: [Domains]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Domain details and readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeDomain
      tags: [Domains]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Domain removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{organizationId}/domains/{domainId}/refresh:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/DomainId'
    post:
      operationId: refreshDomainStatus
      tags: [Domains]
      summary: Poll provider state via Domain SDK
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Updated domain status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{organizationId}/domains/{domainId}/links:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/DomainId'
    get:
      operationId: listLinks
      tags: [Links]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Links on this domain
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createLink
      tags: [Links]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations/{organizationId}/domains/{domainId}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/DomainId'
      - $ref: '#/components/parameters/LinkId'
    get:
      operationId: getLink
      tags: [Links]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateLink
      tags: [Links]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLinkRequest'
      responses:
        '200':
          description: Updated link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteLink
      tags: [Links]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Link deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
    DomainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: openlink.session_token
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: string
      enum: [ok, degraded, error]
    HealthCheckStatus:
      type: string
      enum: [ok, error, skipped]
    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: Stable identifier for the dependency (e.g. d1, auth).
        status:
          $ref: '#/components/schemas/HealthCheckStatus'
        required:
          type: boolean
          default: true
        message:
          type: string
        latencyMs:
          type: number
          minimum: 0
    HealthResponse:
      type: object
      required: [status, service, checkedAt, checks]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        service:
          type: string
          const: openlink
        checkedAt:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    SignUpRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    AuthSessionResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    SessionResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
    Organization:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
    OrganizationRole:
      type: string
      enum: [admin, member]
    OrganizationMembership:
      type: object
      required: [organization, role, joinedAt]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          $ref: '#/components/schemas/OrganizationRole'
        joinedAt:
          type: string
          format: date-time
    CreateOrganizationRequest:
      type: object
      required: [name, slug, inviteToken]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        inviteToken:
          type: string
    CreateOrganizationInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/OrganizationRole'
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    OrganizationInvite:
      type: object
      required: [id, organizationId, email, role, expiresAt, token]
      properties:
        id:
          type: string
        organizationId:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/OrganizationRole'
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
    DomainReadiness:
      type: string
      enum: [pending, verifying, active, failed, removing]
    DnsRecordInstruction:
      type: object
      required: [type, host, value, purpose]
      properties:
        type:
          type: string
        host:
          type: string
        value:
          type: string
        purpose:
          type: string
          enum: [routing, ownership, certificate]
        status:
          type: string
          enum: [required, verified, failed]
    CustomDomain:
      type: object
      required: [id, organizationId, hostname, readiness, dnsRecords, createdAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        hostname:
          type: string
          format: hostname
        readiness:
          $ref: '#/components/schemas/DomainReadiness'
        dnsRecords:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecordInstruction'
        defaultRedirectStatus:
          $ref: '#/components/schemas/RedirectStatus'
        createdAt:
          type: string
          format: date-time
        activeAt:
          type: string
          format: date-time
    AddDomainRequest:
      type: object
      required: [hostname]
      properties:
        hostname:
          type: string
          format: hostname
    RedirectStatus:
      type: integer
      enum: [301, 302, 307, 308]
    LinkStatus:
      type: string
      enum: [draft, scheduled, active, paused, expired, disabled]
    UtmParameters:
      type: object
      properties:
        source:
          type: string
        medium:
          type: string
        campaign:
          type: string
        term:
          type: string
        content:
          type: string
    Link:
      type: object
      required:
        - id
        - organizationId
        - domainId
        - slug
        - destinationUrl
        - redirectStatus
        - status
        - clickCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        domainId:
          type: string
        slug:
          type: string
          description: Path segment on the custom domain (custom or generated).
        alias:
          type: string
          description: Optional vanity alias separate from primary slug.
        title:
          type: string
        description:
          type: string
        destinationUrl:
          type: string
          format: uri
        redirectStatus:
          $ref: '#/components/schemas/RedirectStatus'
        status:
          $ref: '#/components/schemas/LinkStatus'
        enabled:
          type: boolean
        activateAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        maxClicks:
          type: integer
          minimum: 1
        clickCount:
          type: integer
          minimum: 0
        passwordProtected:
          type: boolean
        expiredDestinationUrl:
          type: string
          format: uri
        fallbackDestinationUrl:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        utm:
          $ref: '#/components/schemas/UtmParameters'
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateLinkRequest:
      type: object
      required: [destinationUrl]
      properties:
        slug:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        destinationUrl:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
        redirectStatus:
          $ref: '#/components/schemas/RedirectStatus'
        activateAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        maxClicks:
          type: integer
          minimum: 1
        password:
          type: string
          minLength: 4
        expiredDestinationUrl:
          type: string
          format: uri
        fallbackDestinationUrl:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        utm:
          $ref: '#/components/schemas/UtmParameters'
        metadata:
          type: object
          additionalProperties: true
    UpdateLinkRequest:
      type: object
      properties:
        destinationUrl:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
        redirectStatus:
          $ref: '#/components/schemas/RedirectStatus'
        status:
          $ref: '#/components/schemas/LinkStatus'
        enabled:
          type: boolean
        activateAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        maxClicks:
          type: integer
          minimum: 1
        password:
          type: string
          minLength: 4
        clearPassword:
          type: boolean
        expiredDestinationUrl:
          type: string
          format: uri
        fallbackDestinationUrl:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        utm:
          $ref: '#/components/schemas/UtmParameters'
        metadata:
          type: object
          additionalProperties: true
