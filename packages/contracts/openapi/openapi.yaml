openapi: 3.1.0
info:
  title: OpenLink API
  version: 0.1.0
  description: Contract-first HTTP API for the OpenLink link shortener.
servers:
  - url: /api/v1
    description: Local and production Worker
tags:
  - name: System
  - name: Auth
  - name: Organizations
  - name: Domains
  - name: Links
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness probe
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      tags: [System]
      summary: OpenAPI document for this API
      responses:
        '200':
          description: OpenAPI 3.1 JSON
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          const: openlink
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
